<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パソコン部マニュアル</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- ヘッダーエリア -->
    <header class="header">
        <div class="header-title">〜学校パソコン部マニュアル</div>
        <nav class="header-nav">
            <!-- ホーム -->
            <a class="nav-link" href="./index.html">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>ホーム</span>
            </a>
            <!-- 検索 後で色々治す -->
            <a class="nav-link" href="#search">
                <svg viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <span>検索</span>
            </a>
        </nav>
    </header>

    <!-- メインコンテンツエリア -->
    <div class="main-container">
        <main class="content">
            <h1>このマニュアルについて</h1>
            <p>このサイトは、部活動に関する知識、技術、手順を保存・共有するためのマニュアルです。</p>

            <h2>マニュアルの使い方</h2>
            <p>上部の「検索」から必要な項目を探してください。新しく追加する場合はこのマニュアルについての説明に従って該当<a href="./database/githubepo-update.html">Githubリポジトリの更新</a>をお願いします。</p>

            <h2>マニュアルのバックアップについて</h2>
            <p>このマニュアルにはある程度重要な情報が多いです。定期的にUSB二バックアップを行ってください。</p>　<!-- 画像等で説明 -->
            <p>・</P>
        </main>
    </div>

    <!-- フッターエリア -->
    <footer class="footer">
        <!-- 左側に部活のアイコン指定 -->
        <div class="club-icon-area">
            <img src="./database/images/icon-akikonbu.png" alt="部活アイコン" onerror="this.style.display='none'; this.parentNode.innerText='Akikonbu';">
        </div>

        <div class="footer-center-content">
            <!-- 下に少し小さく&copy -->
            <span class="copyright">&copy; 2026 〜学校パソコン部</span>
        </div>
    </footer>

</body>
</html>
