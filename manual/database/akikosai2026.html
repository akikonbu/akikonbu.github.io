<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パソコン部マニュアル</title>
    <link rel="stylesheet" href="https://akikonbu.f5.si/manual/style.css">
</head>
<body>

    <!-- ヘッダーエリア -->
    <header class="header">
        <div class="header-title">秋田工業高等学校パソコン部マニュアル</div>
        <nav class="header-nav">
            <!-- ホーム -->
            <a class="nav-link" href="./index.html">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>ホーム</span>
            </a>
            <!-- 検索 後で色々治す -->
            <a class="nav-link" href="#search">
                <svg viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <span>検索</span>
            </a>
        </nav>
    </header>

    <!-- メインコンテンツエリア -->
    <div class="main-container">
        <main class="content">
            <h1>2026年秋工祭</h1><br>
            <h2>公開したもの</h2><br>
            <img src="https://images.psknb.workers.dev/akikosai2026-1.png" alt="akikosai2026-1.png"><br> <!--IP制限がかかったサイト-->
            <img src="https://images.psknb.workers.dev/akikosai2026-2.png" alt="akikosai2026-2.png"><br> <!--IP制限がかかったサイト-->
            <img src="https://images.psknb.workers.dev/akikosai2026-3.png" alt="akikosai2026-3.png"><br> <!--IP制限がかかったサイト-->
           <h2>部長コメント</h2><br>
           <p>個人個人でPC関連の話題用意して印刷して、学校祭で音響室とかのホワイトボードとかに貼り付けることで見栄え良くなりそう。もし暇がある時間になにかアイディアとかがあれば<a href="./">ここ</a>とかに書いてください</p>
        </main>
    </div>

    <!-- フッターエリア -->
    <footer class="footer">
        <!-- 左側に部活のアイコン指定 -->
        <div class="club-icon-area">
            <img src="./database/images/icon-akikonbu.png" alt="部活アイコン" onerror="this.style.display='none'; this.parentNode.innerText='Akikonbu';">
        </div>

        <div class="footer-center-content">
            <!-- 下に少し小さく© -->
            <span class="copyright">© 2026 秋田工業高等学校パソコン部</span>
        </div>
    </footer>

</body>
</html>
