<main>
    <h2>公開中のコメント</h2>
    <div id="comment-list">読み込み中...</div>
    <hr>
    <p><a href="/">投稿画面へ戻る</a></p>

    <script>
        fetch('/api/comments')
            .then(res => {
                if (!res.ok) throw new Error('サーバーエラー');
                return res.json();
            })
            .then(data => {
                const list = document.getElementById('comment-list');
                list.innerHTML = data.length ? '' : 'コメントはありません。';
                
                data.forEach(c => {
                    const item = document.createElement('div');
                    // メインの投稿枠
                    item.style = "border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; background: #fff; border-radius: 8px; box-shadow: 1px 1px 3px rgba(0,0,0,0.1);";
                    
                    // --- 投稿エリア専用の枠 ---
                    let content = `
                        <div class="post-box" style="margin-bottom: 10px;">
                            <strong style="color: #333; font-size: 0.9em;">投稿内容:</strong>
                            <div style="margin-top: 5px; line-height: 1.5;">${c.text}</div>
                        </div>
                    `;
                    
                    // --- 返信エリア専用の枠 (c.replyがある時だけ生成) ---
                    if(c.reply && c.reply.trim() !== "") {
                        content += `
                            <div class="reply-box" style="margin-left: 20px; padding: 10px; background: #f0f7ff; border-left: 4px solid #007bff; border-radius: 4px; color: #004488;">
                                <strong style="font-size: 0.85em;">↳ 運営からの返信:</strong>
                                <div style="margin-top: 5px; line-height: 1.5;">${c.reply}</div>
                            </div>
                        `;
                    }
                    
                    item.innerHTML = content;
                    list.appendChild(item);
                });
            })
            .catch((err) => {
                console.error("Fetch error:", err);
                document.getElementById('comment-list').innerHTML = 
                    `<div style="color: red; padding: 10px; border: 1px solid red;">
                        通信エラーが発生しました。サーバー（Flask）が起動しているか、Nginxの設定を確認してください。
                    </div>`;
            });
    </script>
</main>
